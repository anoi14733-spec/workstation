<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工作站 · 内部协作原型</title>
<style>
/* SECTION: tokens —「编辑部案头」7.4 最终微调版 */
:root{
  --paper:#efe2cb;      /* 全站底色：脏黄纸 */
  --card:#f6eedd;       /* 纸面：卡片/表单底 */
  --card-sunk:#e8dbbe;  /* 稍深纸面：分区底 */
  --ink:#3a2f21;        /* 褐墨：正文、标题、边框 */
  --muted:#8c7b5f;      /* 暖灰：辅文 */
  --rule:#cdbc9d;       /* 土黄褐：行线、边框 */
  --blue:#32546e;       /* 墨蓝：唯一交互色 */
  --blue-deep:#264054;  /* 墨蓝按压态 */
  --orange:#c4652a;     /* 柿橙：待投票专属 */
  --cinnabar:#b3362d;   /* 朱砂：印章专属 */
  --hl:#f2d98c;         /* 荧光笔暗黄：全文搜索命中高亮 */
  --serif:"Source Han Serif SC","Noto Serif CJK SC","Songti SC","STSong",SimSun,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","Cascadia Code",Menlo,Consolas,"Liberation Mono","Courier New",ui-monospace,"PingFang SC","Microsoft YaHei",monospace;
  --r:7px;              /* 方角克制：6–8px */
  --pad:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:17px/1.6 var(--sans);letter-spacing:.01em;
}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-family:var(--serif);font-weight:700;letter-spacing:.02em}
p{margin:0 0 12px}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
input,select,textarea{font:16px/1.5 var(--sans);color:var(--ink);background:var(--card);
  border:1px solid var(--ink);border-radius:var(--r);padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
textarea{resize:vertical;min-height:96px}
::placeholder{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* SECTION: shell */
.shell{max-width:1080px;margin:0 auto;padding:0 20px 120px}
.masthead{border-bottom:1px solid var(--ink);padding:18px 0 12px;margin-bottom:26px}
.mast-in{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;justify-content:space-between}
.wordmark{font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:.3em;line-height:1}
.wordmark small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.2em;color:var(--muted);margin-top:6px;font-weight:400}
.topnav{display:flex;gap:22px;align-items:center;font-size:15px}
.topnav a{color:var(--muted);padding:6px 0;border-bottom:2px solid transparent}
.topnav a.on{color:var(--blue);border-bottom-color:var(--blue)}
.whoami{font-size:13px;color:var(--muted)}
.whoami b{color:var(--ink);font-weight:600}
.blk-title{font-size:21px;border-bottom:2px solid var(--ink);padding-bottom:9px;margin:34px 0 18px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.blk-title span.sub{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--ink);border-radius:var(--r);padding:var(--pad)}
.card+.card{margin-top:12px}
.rule-hair{border-top:1px solid var(--rule)}
.foot{margin-top:44px;padding-top:14px;border-top:1px solid var(--rule);text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted)}

/* SECTION: buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;
  border-radius:var(--r);border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;font-size:15px}
.btn:hover{background:var(--card-sunk);text-decoration:none}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#f6eedd}
.btn-primary:hover{background:var(--blue-deep);border-color:var(--blue-deep)}
.btn-sm{min-height:34px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;background:transparent;color:var(--muted);border-color:var(--rule)}
.btn-danger{border:1px solid var(--cinnabar);color:var(--cinnabar);background:transparent}
.btn-danger:hover{background:#f3ddd6;border-color:var(--cinnabar)}
.delete-link{background:none;border:none;padding:0;color:var(--cinnabar);cursor:pointer;font-size:13px}
.delete-link:hover{text-decoration:underline}
.link{background:none;border:none;padding:0;color:var(--blue);cursor:pointer;font-size:14px;text-decoration:underline}
.link.mut{color:var(--muted);text-decoration:none}

/* SECTION: seals — 纯 CSS 印章，红色只活在印章里 */
.seal{position:relative;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:700;letter-spacing:.14em;color:var(--cinnabar);
  border:2px solid currentColor;border-radius:3px;padding:1px 9px;transform:rotate(-2deg);opacity:.92;line-height:1.5}
.seal::after{content:"";position:absolute;inset:2px;border:1px solid currentColor;border-radius:2px;opacity:.4}
.seal-reject{color:#6d6355}
.seal-dep{color:#9c8d76;font-size:12px;padding:0 6px}
.seal-lg{font-size:22px;padding:8px 18px;letter-spacing:.2em}
.seal-sm{font-size:12px;padding:0 7px}

/* SECTION: 待办签条（索引签） */
.note-list{display:flex;flex-direction:column;gap:0}
.note{display:flex;align-items:stretch;gap:0;background:var(--card);border:1px solid var(--rule);
  border-radius:var(--r);margin-bottom:10px;overflow:hidden;color:inherit;cursor:pointer}
.note:hover{text-decoration:none;border-color:var(--ink)}
.note .bar{width:6px;background:var(--orange);flex:0 0 6px}
.note.unvoted .bar{width:12px;flex-basis:12px}
.note .body{padding:12px 14px;flex:1;min-width:0}
.note .t{font-family:var(--serif);font-size:18px;font-weight:700}
.note .s{font-size:13px;color:var(--muted);margin-top:4px}
.note .vote-line{font-size:13px;margin-top:8px;color:var(--ink)}
.note .days{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 14px;border-left:1px solid var(--rule);font-family:var(--mono);color:var(--orange)}
.note .days b{font-size:22px;line-height:1;font-weight:700}
.note .days span{font-size:11px;margin-top:4px;letter-spacing:.1em;color:var(--muted)}
.note.unvoted{border-color:var(--orange)}

/* SECTION: 索引标签（档案袋侧签） */
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--card-sunk);border:1px solid var(--rule);
  border-radius:4px;padding:2px 9px 2px 6px;font-size:12.5px;color:var(--ink);margin:0 6px 6px 0;line-height:1.6}
.tag::before{content:"";width:4px;height:12px;border-left:1px solid var(--ink);background:var(--muted)}
.tag.pick{cursor:pointer;user-select:none}
.tag.pick[aria-pressed="true"]{border-color:var(--ink);background:#e3d3b3;box-shadow:inset 0 0 0 1px var(--ink)}
.tag.pick[aria-pressed="false"]{opacity:.72}
.tag.off{cursor:default;opacity:.6}

/* SECTION: 账本时间线 */
.ledger{border-top:1px solid var(--ink)}
.lg-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--rule);font-size:14px}
.lg-row .d{font-family:var(--mono);color:var(--muted);min-width:92px}
.lg-row .v{font-family:var(--mono);font-weight:700;min-width:52px}
.lg-row .nm{flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-row .src{font-size:12.5px;color:var(--muted)}
.lg-row.now{background:var(--card-sunk)}

/* SECTION: 档案列表行 */
.row{display:flex;gap:14px;align-items:flex-start;padding:14px 2px;border-bottom:1px solid var(--rule);cursor:pointer}
.row:hover{text-decoration:none}
.row:hover .row-t{color:var(--blue)}
.row-t{font-family:var(--serif);font-size:19px;font-weight:700;transition:none}
.row-i{font-size:14px;color:var(--muted);margin-top:5px}
.row-side{margin-left:auto;text-align:right;font-size:12.5px;color:var(--muted);flex:0 0 auto}
.row.now .row-t::after{content:"现行";font-family:var(--sans);font-size:11px;letter-spacing:.14em;color:var(--blue);border:1px solid var(--blue);border-radius:3px;padding:0 5px;margin-left:9px;vertical-align:2px}
.fold{background:var(--card-sunk);border:1px solid var(--rule);border-radius:var(--r);padding:10px 14px;margin-top:14px}
.fold>summary{cursor:pointer;font-size:14px;color:var(--muted);list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:32px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"展开 ▾";font-family:var(--mono);font-size:12px;color:var(--blue)}
.fold[open]>summary::after{content:"收起 ▴"}

/* SECTION: 提案与投票 */
.prow{display:block;padding:14px 0;border-bottom:1px solid var(--rule);cursor:pointer;color:inherit}
.prow:hover{text-decoration:none;background:var(--card-sunk)}
.prow .pt{font-family:var(--serif);font-size:18px;font-weight:700}
.prow .pm{font-size:13px;color:var(--muted);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 16px}
.prow .pb{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--orange)}
.votebox{border:1px solid var(--ink);border-radius:var(--r);background:var(--card);padding:20px;text-align:center}
.votebox .tally{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:.04em}
.votebox .tally em{font-style:normal;color:var(--muted);font-size:16px}
.vote-actions{display:flex;gap:12px;justify-content:center;margin:16px 0 6px;flex-wrap:wrap}
.vote-actions .btn{flex:1;max-width:180px;min-width:132px}
.stance{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--rule);font-size:15px}
.stance:last-child{border-bottom:none}
.stance .nm{flex:1}
.stance .st{font-family:var(--mono);font-size:13px;letter-spacing:.06em}
.st-yes{color:var(--blue)}
.st-no{color:var(--cinnabar)}
.st-wait{color:var(--muted)}

/* SECTION: 头像 */
.av{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:700;font-size:14px;background:var(--card-sunk);color:var(--ink);border:2px solid var(--ink)}
.av.sm{width:26px;height:26px;flex-basis:26px;font-size:12px;border-width:1.5px}
.av.lg{width:60px;height:60px;flex-basis:60px;font-size:24px}
.av-pick{cursor:pointer}
.av-pick[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--blue)}

/* SECTION: 留言（论坛式） */
.cmt{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule)}
.cmt .floor{font-family:var(--mono);font-size:12px;color:var(--muted);flex:0 0 auto;padding-top:3px}
.cmt .cbody{flex:1;min-width:0}
.cmt .chead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.cmt .cname{font-weight:600;font-size:15px}
.cmt .ctime{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cmt .ctext{margin-top:6px;font-size:15.5px;word-break:break-word}
.cmt .cact{margin-top:8px;display:flex;gap:16px;align-items:center}
.mention{color:var(--blue);font-weight:600}
.replies{margin:10px 0 0;padding:10px 14px;background:var(--card-sunk);border-left:2px solid var(--rule);border-radius:0 var(--r) var(--r) 0}
.replies .cmt{padding:9px 0;border-bottom:1px dashed var(--rule)}
.replies .cmt:last-child{border-bottom:none}
.like{background:none;border:none;cursor:pointer;color:var(--muted);font-size:13px;padding:2px 0}
.like.on{color:var(--blue)}
.locked-note{background:var(--card-sunk);border:1px solid var(--rule);border-radius:var(--r);padding:10px 14px;font-size:13.5px;color:var(--muted)}

/* SECTION: 首页网格与板块卡 */
.hero-hi{font-family:var(--serif);font-size:26px;font-weight:700;margin:0}
.hero-wb{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted);letter-spacing:.06em;margin-top:6px}
.hero-line{font-size:16px;margin-top:12px}
.hero-line b{color:var(--orange);font-family:var(--mono);font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.board{display:flex;flex-direction:column;gap:0;padding:16px 0;border-bottom:1px solid var(--rule);color:inherit}
.board:hover{text-decoration:none}
.board:hover .bt{color:var(--blue)}
.board .bt{font-family:var(--serif);font-size:20px;font-weight:700}
.board .bd{font-size:14px;color:var(--muted);margin-top:5px}
.board .bnum{font-family:var(--mono);font-size:13px;color:var(--blue);margin-top:8px;letter-spacing:.04em}
.feed{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14.5px;align-items:flex-start}
.feed:last-child{border-bottom:none}
.feed .ft{font-family:var(--mono);font-size:12px;color:var(--muted);flex:0 0 68px;padding-top:2px}
.feed .fx{flex:1;min-width:0}
.empty{padding:26px 12px;text-align:center;color:var(--muted);font-size:14.5px;border:1px dashed var(--rule);border-radius:var(--r);background:transparent}

/* SECTION: 表单与筛选 */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.filters input[type=search]{flex:1;min-width:180px}
.filters select{width:auto;min-width:120px}
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:7px}
.steps{display:flex;gap:0;margin:0 0 24px;padding:0;list-style:none;border:1px solid var(--ink);border-radius:var(--r);overflow:hidden}
.steps li{flex:1;padding:10px 8px;text-align:center;font-size:13px;color:var(--muted);background:var(--card);border-left:1px solid var(--rule)}
.steps li:first-child{border-left:none}
.steps li.on{background:var(--card-sunk);color:var(--ink);font-weight:600}
.steps li.done{color:var(--blue)}
.steps li .n{font-family:var(--mono);margin-right:6px}
.upload{border:1px dashed var(--ink);border-radius:var(--r);padding:22px;text-align:center;background:var(--card)}
.upload .ok{font-family:var(--mono);font-size:14px}
.err{border:1px solid var(--ink);border-radius:var(--r);background:#e9d9c2;padding:12px 14px;font-size:14.5px;color:var(--ink)}
.err b{color:var(--orange)}
.hint{font-size:13.5px;color:var(--muted);margin-top:8px}
.kv{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.kv:last-child{border-bottom:none}
.kv b{flex:0 0 92px;font-weight:600}
.md-body{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px;font-size:15.5px;overflow-x:auto}
.md-body h2{font-size:20px;margin:16px 0 10px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.md-body h3{font-size:17px;margin:14px 0 8px}
.md-body p{margin:0 0 10px}
.md-body ul,.md-body ol{margin:0 0 12px;padding-left:22px}
.md-body li{margin:4px 0}
.md-body blockquote{margin:0 0 12px;padding:6px 14px;border-left:2px solid var(--ink);color:var(--muted);background:var(--card-sunk)}
.md-body code{font-family:var(--mono);font-size:13.5px;background:var(--card-sunk);padding:1px 5px;border-radius:3px}
.pdf-frame{background:var(--card-sunk);border:1px solid var(--rule);border-radius:var(--r);min-height:220px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;color:var(--muted);padding:14px;text-align:center}
.img-frame{border:1px solid var(--rule);border-radius:var(--r);background:var(--card-sunk);padding:8px;text-align:center}
.img-frame img{max-width:100%;height:auto;display:block;margin:0 auto}

/* SECTION: 介绍页《砚叙》 */
.cover{padding:56px 20px 44px;text-align:center;border-bottom:1px solid var(--ink)}
.cover .game{font-family:var(--serif);font-size:56px;font-weight:700;letter-spacing:.24em;text-indent:.24em;margin:0}
.cover .cate{font-family:var(--mono);font-size:13px;letter-spacing:.2em;color:var(--muted);margin-top:14px}
.cover .hook{font-family:var(--serif);font-size:20px;line-height:1.8;margin:26px auto 0;max-width:640px}
.cta-row{display:flex;gap:14px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.cover .stamp-note{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:26px;letter-spacing:.08em}
.toc{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--ink);padding:10px 0;margin-bottom:8px;display:flex;gap:20px;overflow-x:auto}
.toc a{color:var(--muted);font-size:14.5px;white-space:nowrap;padding:4px 0;border-bottom:2px solid transparent}
.toc a.on{color:var(--blue);border-bottom-color:var(--blue)}
.toc-toggle{display:none}
.lead{font-family:var(--serif);font-size:19px;line-height:2.05;margin:0 0 14px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.tri .cell{padding:20px 18px;border-left:1px solid var(--rule)}
.tri .cell:first-child{border-left:none}
.tri .st{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.1em}
.tri .nm{font-family:var(--serif);font-size:24px;font-weight:700;margin:8px 0 10px}
.tri .ds{font-size:15px;color:var(--ink)}
.tbd{border:1px dashed var(--muted);border-radius:var(--r);padding:12px 14px;margin:10px 0;font-size:15px;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tbd .lab{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--card);background:var(--muted);border-radius:3px;padding:2px 7px;flex:0 0 auto}
.tbd .fill{flex:1;min-width:160px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cols4{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.cols4 .stat{border:none;border-left:1px solid var(--rule);border-radius:0;background:transparent;padding:14px 16px}
.cols4 .stat:first-child{border-left:none}
.lg-row.pick{cursor:pointer}
.lg-row.pick:hover{background:var(--card-sunk)}
.lg-row.sel{background:#e3d3b3}
.mile{border-top:1px solid var(--rule);padding:10px 2px;font-size:14.5px}
.stat{border:1px solid var(--ink);border-radius:var(--r);padding:14px;background:var(--card)}
.stat .k{font-size:13px;color:var(--muted);letter-spacing:.06em}
.stat .v{font-family:var(--serif);font-size:18px;font-weight:700;margin-top:8px}
.post{border-top:1px solid var(--ink);padding:18px 0;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.post .pn{font-family:var(--serif);font-size:19px;font-weight:700;flex:0 0 auto;min-width:140px}
.post .pd{flex:1;min-width:200px;font-size:15px;color:var(--muted)}
.sig{text-align:right;font-size:15px;color:var(--muted);margin-top:18px}
.sig b{font-family:var(--serif);color:var(--ink);font-size:17px}

/* SECTION: 登录页 */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px}
.login-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--ink);border-radius:var(--r);padding:34px 28px}
.login-card .wordmark{text-align:center;font-size:26px;letter-spacing:.3em;text-indent:.3em}
.login-card .subline{border-bottom:1px solid var(--ink);margin:14px 0 24px;padding-bottom:18px;text-align:center;font-size:13px;color:var(--muted);letter-spacing:.1em}
.demo-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid var(--rule);border-radius:4px;background:var(--card-sunk);padding:6px 10px;font-family:var(--mono);font-size:12.5px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--ink)}
.login-note{font-size:13px;color:var(--muted);margin-top:18px;line-height:1.7}

function inlineNodes(line) {
  const out = [], re = /(\*\*[^*]+\*\*|`[^`]+`|@[A-Za-z\u4e00-\u9fa5]+)/g;
  let last = 0, m;
  while ((m = re.exec(line))) {
    if (m.index > last) out.push(txt(line.slice(last, m.index)));
    const tk = m[0];
    if (tk[0] === "*") out.push(h("strong", { text: tk.slice(2, -2) }));
    else if (tk[0] === "`") out.push(h("code", { text: tk.slice(1, -1) }));
    else out.push(h("span", { class: "mention", text: tk }));
    last = m.index + tk.length;
  }
  if (last < line.length) out.push(txt(line.slice(last)));
  return out;
}
function mdBlock(text) {
  const root = box("md-body");
  const lines = String(text || "").split("\n");
  let list = null;
  const closeList = () => { list = null; };
  lines.forEach(raw => {
    const line = raw.trim();
    if (!line) { closeList(); return; }
    if (line[0] === "#") {
      const lvl = line.match(/^#+/)[0].length;
      closeList();
      root.appendChild(h(lvl >= 3 ? "h3" : "h2", { text: line.replace(/^#+\s*/, "") }));
      return;
    }
    if (line[0] === ">") { closeList(); root.appendChild(box("blockquote", inlineNodes(line.replace(/^>\s*/, "")))); return; }
    if (line[0] === "-" || line[0] === "•") {
      if (!list) { list = h("ul", {}); root.appendChild(list); }
      list.appendChild(h("li", {}, inlineNodes(line.replace(/^[-•]\s*/, ""))));
      return;
    }
    if (/^\d+\.\s/.test(line)) {
      if (!list || list.tagName !== "OL") { list = h("ol", {}); root.appendChild(list); }
      list.appendChild(h("li", {}, inlineNodes(line.replace(/^\d+\.\s/, ""))));
      return;
    }
    closeList();
    root.appendChild(h("p", {}, inlineNodes(line)));
  });
  if (!root.childNodes.length) root.appendChild(box("muted", "（此版本没有可预览的正文）"));
  return root;
}

/* SECTION: settlement — 惰性结算：打开页面即检查到期提案 */
function settleDue() {
  let changed = false;
  S.proposals.filter(p => p.status === "open").forEach(p => {
    const tally = votesOf(p);
    if (tally.yes >= threshold()) { finish(p, "pass", "表决通过"); changed = true; return; }
    if (tally.no >= threshold()) { finish(p, "reject", "反对已达 " + threshold() + " 票，无法达到通过线，提前结算为否决"); changed = true; return; }  /* 对称提前结算：3 反对即注定否决，不再空等 14 天 */
    if (daysLeft(p.deadline) < 0) { finish(p, "reject", "到期未达线，自动视为否决"); changed = true; }
  });
  if (changed) save();
  return changed;
}
function finish(p, result, reason) {
  p.status = result;
  p.settledAt = today();
  p.settleReason = reason;
  applyVersion(p, result);
}
function nextV(a) { return (a.versions || []).reduce((m, v) => Math.max(m, v.v), 0) + 1; }
function applyVersion(p, result) {
  const date = today();
  if (p.type === "new") {
    let a = archive(p.archiveId);
    if (S.archives.some(ar => (ar.versions || []).some(v => v.from === p.id))) return;   /* 幂等：同一提案只入档一次 */
    if (!a) {
      a = { id: "A" + Date.now(), title: (p.pendingTitle || p.file.name).replace(/\.[a-z]+$/i, "").replace(/-v\d+$/i, ""), intro: p.desc, tags: p.tagIds.slice(), versions: [] };
      S.archives.unshift(a);
      p.archiveId = a.id;
      p.createdArchive = true;
    }
    a.versions = [{ v: nextV(a), status: result === "pass" ? "现行" : "弃用", date: date, from: p.id, file: p.file }].concat(a.versions || []);
  } else {
    const a = archive(p.archiveId);
    if (!a) return;
    if (!a.versions.some(v => v.from === p.id)) {
      if (result === "pass") (a.versions || []).forEach(v => { if (v.status === "现行") v.status = "历史"; });
      a.versions = [{ v: nextV(a), status: result === "pass" ? "现行" : "弃用", date: date, from: p.id, file: p.file }].concat(a.versions || []);
    }
  }
}

  }).catch(e => { CLOUD.err = e.message; });
}
